set -g mouse on

bind-key u capture-pane \; save-buffer /tmp/tmux-buffer \; run-shell "cat /tmp/tmux-buffer | urlview"
bind-key y run-shell "nohup bash -c 'tmux capture-pane -p | grep -o \"http[s]*://[^ ]*\" | tail -n1 | xclip -selection clipboard' >/dev/null 2>&1 &"

# Numerar ventanas desde 1
set -g base-index 1
# Numerar paneles desde 1
set -g pane-base-index 1
# Reordenar automáticamente si cierras una ventana
set -g renumber-windows on
